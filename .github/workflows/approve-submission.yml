name: Publish Submission

on:
  issues:
    types: [closed]

jobs:
  publish:
    if: >
      contains(github.event.issue.labels.*.name, 'wiki-submission') &&
      github.event.issue.state_reason == 'completed'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = context.payload.issue.body;
            
            const slug = (body.match(/<!-- slug: (.*?) -->/) || [])[1] || `page-${context.payload.issue.number}`;
            const title = (body.match(/<!-- title: (.*?) -->/) || [])[1] || 'Untitled';
            const html = body.replace(/<!--.*?-->/g, '').trim();

            const doc = `<!DOCTYPE html>\n<html>\n<head><title>${title}</title></head>\n<body>\n<h1>${title}</h1>\n${html}\n</body>\n</html>`;

            fs.mkdirSync('wiki', { recursive: true });
            fs.writeFileSync(`${slug}.html`, doc);

      - run: |
          git config --global user.name "bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add .
          git commit -m "add page #${{ github.event.issue.number }}"
          git push
